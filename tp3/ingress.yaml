apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: python-api-ingress
spec:
  rules:
  - host: python-api-test.lab.sspcloud.fr
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: python-api-service
            port:
              number: 80